services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ai_connect
      POSTGRES_PASSWORD: ai_connect_dev
      POSTGRES_DB: ai_connect
    # Override host port via POSTGRES_PORT if 5432 is already taken locally.
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ai_connect_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_connect"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ai_connect_pgdata:
