<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>LLM-UI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
    />
    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
        overflow: hidden;
      }
      body {
        background: #fafaf7;
        color: #1a1816;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #09090b;
          color: #fafaf7;
        }
      }
      #boot-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.25rem;
        transition: opacity 300ms ease;
        z-index: 9999;
      }
      #boot-loader[data-hidden='true'] {
        opacity: 0;
        pointer-events: none;
      }
      .boot-logo {
        width: 56px;
        height: 56px;
        border-radius: 14px;
        background: oklch(0.62 0.19 38);
        animation: bootPulse 1.5s ease-in-out infinite;
      }
      .boot-bar {
        width: 10rem;
        height: 4px;
        border-radius: 2px;
        background: rgba(0, 0, 0, 0.08);
        overflow: hidden;
        position: relative;
      }
      .boot-bar::after {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        width: 4rem;
        background: linear-gradient(
          90deg,
          transparent,
          oklch(0.62 0.19 38),
          transparent
        );
        animation: bootShimmer 1.2s linear infinite;
      }
      @media (prefers-color-scheme: dark) {
        .boot-bar {
          background: rgba(255, 255, 255, 0.08);
        }
      }
      @keyframes bootPulse {
        0%,
        100% {
          transform: scale(0.92);
          opacity: 0.6;
        }
        50% {
          transform: scale(1);
          opacity: 1;
        }
      }
      @keyframes bootShimmer {
        0% {
          transform: translateX(-10rem);
        }
        100% {
          transform: translateX(10rem);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-logo,
        .boot-bar::after {
          animation: none;
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot-loader" aria-hidden="true">
      <div class="boot-logo"></div>
      <div class="boot-bar"></div>
    </div>
    <div id="root"></div>
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('ui-theme');
          var theme = 'system';
          if (raw) {
            try {
              var parsed = JSON.parse(raw);
              theme = (parsed && parsed.state && parsed.state.theme) || 'system';
            } catch (_) {}
          }
          var dark =
            theme === 'dark' ||
            (theme === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (_) {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
